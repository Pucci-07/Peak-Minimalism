<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9C27B0; stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <stop offset="0%" style="stop-color:#fff; stop-opacity:1" />
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#1a1a2e" rx="10"/>

  <g filter="url(#glow)" stroke="url(#neonGradient)" stroke-width="2" fill="none">
    
    <path d="M128,40 L192,80 L192,176 L128,216 L64,176 L64,80 Z" stroke-dasharray="10,5"/>
    
    <g transform="translate(100, 110)">
      <path d="M20,10 L10,25 L20,40" stroke-linecap="round"/>
      <path d="M36,10 L46,25 L36,40" stroke-linecap="round"/>
      <path d="M25,50 L31,5" stroke-dasharray="3,3"/>
    </g>
    
    <circle cx="128" cy="128" r="50"/>
  </g>
